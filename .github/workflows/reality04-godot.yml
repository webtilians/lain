name: LAIN Godot city and gameplay smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  godot-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-download
          GODOT_BIN="$(find /tmp/godot-download -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          cp "$GODOT_BIN" /tmp/lain-godot
          /tmp/lain-godot --version
      - name: Import client and type-check all scripts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --editor --import --quit 2>&1 | tee /tmp/lain-import.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-import.log; then
            exit 1
          fi
      - name: Two real online Godot clients in an isolated world
        run: python tools/smoke_online01.py --godot /tmp/lain-godot
      - name: Start menu signs up and logs in against a real online World Core
        run: python tools/smoke_startmenu.py --godot /tmp/lain-godot
      - name: Stalled connections release dialogue and prologue requests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_network_recovery.gd 2>&1 | tee /tmp/lain-network-recovery.log
          grep -q 'NETWORK_RECOVERY_OK' /tmp/lain-network-recovery.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-network-recovery.log; then
            exit 1
          fi
      - name: Offline journal and station case
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_reality04_journal.gd 2>&1 | tee /tmp/lain-journal.log
          grep -q 'REALITY04_JOURNAL_OK' /tmp/lain-journal.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-journal.log; then
            exit 1
          fi
      - name: Visual 0.6 character rig and Reality 0.3 patrol
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/check_character06.gd 2>&1 | tee /tmp/lain-character.log
          grep -q 'CHARACTER06_CHECK_OK' /tmp/lain-character.log
          /tmp/lain-godot --headless --path client --script res://tools/test_reality03_visual.gd 2>&1 | tee /tmp/lain-patrol.log
          grep -q 'REALITY03_VISUAL_OK' /tmp/lain-patrol.log

      - name: New-game prologue physical scenes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_prologue01_visual.gd 2>&1 | tee /tmp/lain-prologue.log
          grep -q 'PROLOGUE01_VISUAL_OK' /tmp/lain-prologue.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-prologue.log; then
            exit 1
          fi

      - name: City physical routes, returns, actor placement and camera
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s /tmp/lain-godot --headless --path client --script res://tools/test_city08.gd 2>&1 | tee /tmp/lain-city.log
          grep -q 'CITY08_CHECK_OK' /tmp/lain-city.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-city.log; then
            exit 1
          fi

      - name: 56 citizens and six shop interiors
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/lain-godot --headless --path client --script res://tools/test_city09.gd 2>&1 | tee /tmp/lain-city09.log
          grep -q 'CITY09_RESIDENTS_PASS population=56 shops=6' /tmp/lain-city09.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-city09.log; then
            exit 1
          fi

      - name: Rendering presets preserve physics in all twelve locations
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_realism10.gd 2>&1 | tee /tmp/lain-realism10.log
          grep -q 'REALISM10_CHECK_OK scenes=12 presets=3 physics_unchanged=true' /tmp/lain-realism10.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-realism10.log; then
            exit 1
          fi

      - name: Chapter one objects, provenance journal and dialogue layout
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_chapter01.gd 2>&1 | tee /tmp/lain-chapter01.log
          grep -q 'CHAPTER01_GAMEPLAY_OK views=11' /tmp/lain-chapter01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-chapter01.log; then
            exit 1
          fi

      - name: Corporate conflict objects and controls
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_conflict01.gd 2>&1 | tee /tmp/lain-conflict01.log
          grep -q 'CONFLICT01_GAMEPLAY_OK views=9' /tmp/lain-conflict01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-conflict01.log; then
            exit 1
          fi

      - name: Workshop editor, café terminal and playable practice
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_workshop01.gd 2>&1 | tee /tmp/lain-workshop01.log
          grep -q 'WORKSHOP01_GAMEPLAY_OK' /tmp/lain-workshop01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-workshop01.log; then
            exit 1
          fi

      - name: NOEMA physical agents, controller selection and simultaneous orders
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_noema01.gd 2>&1 | tee /tmp/lain-noema01.log
          grep -q 'NOEMA01_GAMEPLAY_OK views=9 locations=4' /tmp/lain-noema01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-noema01.log; then
            exit 1
          fi

      - name: Circles PC pages, NPC entry points, drafts and shared actions
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_circles01.gd 2>&1 | tee /tmp/lain-circles01.log
          grep -q 'CIRCLES01_GAMEPLAY_OK views=11' /tmp/lain-circles01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-circles01.log; then
            exit 1
          fi

      - name: Cafe tournaments calendar, mirrored board, ranking and prize
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_events01.gd 2>&1 | tee /tmp/lain-events01.log
          grep -q 'EVENTS01_GAMEPLAY_OK views=7' /tmp/lain-events01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-events01.log; then
            exit 1
          fi

      - name: Snake animation rules, practice, tournaments and lost-response retry
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_arcade01.gd 2>&1 | tee /tmp/lain-arcade01.log
          grep -q 'ARCADE01_GAMEPLAY_OK views=6 rule_steps=182' /tmp/lain-arcade01.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-arcade01.log; then
            exit 1
          fi

      - name: Spanish/English catalogue is identical on client and server
        run: python tools/sync_translations.py --check

      - name: English start menu, language switch and translated labels
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_i18n.gd 2>&1 | tee /tmp/lain-i18n.log
          grep -q 'I18N_OK' /tmp/lain-i18n.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-i18n.log; then
            exit 1
          fi

      - name: Online start menu, sign-up, login and legacy password claim
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_startmenu.gd 2>&1 | tee /tmp/lain-startmenu.log
          grep -q 'STARTMENU_OK' /tmp/lain-startmenu.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-startmenu.log; then
            exit 1
          fi

      - name: Capa 03 shell, cabinet console and fading signal
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_layer03.gd 2>&1 | tee /tmp/lain-layer03.log
          grep -q 'LAYER03_CLIENT_OK' /tmp/lain-layer03.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-layer03.log; then
            exit 1
          fi

      - name: Sound — ambience per place, interface effects and F7 volume
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_audio.gd 2>&1 | tee /tmp/lain-audio.log
          grep -q 'AUDIO_OK' /tmp/lain-audio.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-audio.log; then
            exit 1
          fi

      - name: First-minutes guide, objective on screen and terminal tips
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_guide.gd 2>&1 | tee /tmp/lain-guide.log
          grep -q 'GUIDE_OK' /tmp/lain-guide.log
          if grep -E '^(SCRIPT ERROR:|ERROR:)' /tmp/lain-guide.log; then
            exit 1
          fi

      - name: Terminal intro before the start menu
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_intro.gd 2>&1 | tee /tmp/lain-intro.log
