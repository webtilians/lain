      - name: Physical code contacts, copy review, receipts and stable retries
        shell: bash
        run: |
          set -euo pipefail
          /tmp/lain-godot --headless --path client --script res://tools/test_exchange01.gd 2>&1 | tee /tmp/lain-exchange01.log
