name: Shared AI relay — deterministic and Worker runtime tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shared-ai
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/shared-ai/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
