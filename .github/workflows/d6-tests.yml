name: LAIN Python regression tests

on:
  push:
    branches:
      - develop/isometric-0.2-d6
      - develop/isometric-0.2-d7
      - develop/isometric-0.2-d8
      - develop/isometric-0.2-d8-r1
      - develop/isometric-0.2-d8-r2
      - develop/isometric-0.2-d8-r3
      - develop/isometric-0.2-d9
      - develop/isometric-0.2-d9-r1
      - experiment/isometric-0.2-d10-episodic
      - experiment/isometric-0.2-d11-shared-experiences
      - experiment/isometric-0.2-d11-r1-recall
      - experiment/visual-0.3-apartment
      - experiment/reality-0.1-generated-entities
      - experiment/visual-reality-0.3-r1
      - experiment/visual-0.4-lain-environments
      - experiment/reality-0.2-autonomy-visual04
      - experiment/visual-0.5-illustrated
      - experiment/visual-0.8-city-neighborhood
      - experiment/visual-0.9-living-neighborhood
      - experiment/visual-0.10-realism
      - experiment/chapter-0.1-already-here
      - experiment/wired-0.1-corporation
      - experiment/wired-0.2-workshop
      - experiment/wired-0.3-noema
      - experiment/wired-0.4-circles
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic and mocked LLM tests
        env:
          LAIN_LLM_ENABLED: "0"
          LAIN_MEMORY_SEMANTIC: "0"
        run: python -m pytest -q
      - name: Chapter one real HTTP boundary in a disposable world
        run: python tools/smoke_chapter01_http.py
      - name: Corporate conflict HTTP and server-bound identity
        run: python tools/smoke_chapter01_http.py --network
      - name: Workshop HTTP lesson, equipment and replay
        run: python tools/smoke_chapter01_http.py --workshop
      - name: NOEMA HTTP independent orders and individual evidence
        run: python tools/smoke_chapter01_http.py --noema
      - name: Circles HTTP local consent, deduplication and actual shared modules
        run: python tools/smoke_chapter01_http.py --circles
